---

name: Publish Slopnote

# Builds the flatpak and publishes it to the flatpak repo on the server, which anyone with the
# remote added gets as an update. See build-aux/slopnote-repo/README.md for what has to be set up
# before this can run.

on:
    push:
        branches:
            - main
    workflow_dispatch:

# One publish at a time: two of them would race for the symlink the repo is served through.
concurrency:
    group: slopnote-publish
    cancel-in-progress: false

env:
    MANIFEST: build-aux/ch.andrinwinzap.Slopnote.yaml
    RUNTIME_VERSION: "50"
    RUST_EXTENSION_VERSION: "25.08"

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 90

        steps:
            - name: Check that everything it needs is set
              env:
                  FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
                  SLOPNOTE_REPO_URL: ${{ vars.SLOPNOTE_REPO_URL }}
              run: |
                  # Said here rather than an hour later, at the end of a build that cannot land.
                  missing=
                  for name in FLATPAK_GPG_PRIVATE_KEY DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS \
                      DEPLOY_HOST DEPLOY_USER DEPLOY_PATH SLOPNOTE_REPO_URL; do
                      [ -n "${!name}" ] || missing="$missing $name"
                  done
                  if [ -n "$missing" ]; then
                      echo "not set:$missing" >&2
                      echo "build-aux/slopnote-repo/README.md says what each one is" >&2
                      exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@v4

            - name: Install flatpak
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder ostree rsync

            - name: Install the runtime
              run: |
                  flatpak remote-add --user --if-not-exists \
                      flathub https://dl.flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y --noninteractive \
                      "org.gnome.Platform//${RUNTIME_VERSION}" \
                      "org.gnome.Sdk//${RUNTIME_VERSION}" \
                      "org.freedesktop.Sdk.Extension.rust-stable//${RUST_EXTENSION_VERSION}"

            # The build downloads and compiles the whole dependency tree, which takes the better
            # part of an hour from nothing. What it keeps is reused as far as the sources allow.
            - name: Restore the build cache
              uses: actions/cache@v4
              with:
                  path: .flatpak-builder
                  key: flatpak-builder-${{ hashFiles('build-aux/ch.andrinwinzap.Slopnote.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      flatpak-builder-${{ hashFiles('build-aux/ch.andrinwinzap.Slopnote.yaml') }}-
                      flatpak-builder-

            - name: Import the signing key
              env:
                  SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
              run: |
                  printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
                  fingerprint=$(gpg --list-secret-keys --with-colons \
                      | awk -F: '/^fpr:/ { print $10; exit }')
                  if [ -z "$fingerprint" ]; then
                      echo "no signing key was imported" >&2
                      exit 1
                  fi
                  echo "GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

            - name: Build the flatpak
              run: |
                  # rofiles-fuse needs a fuse device the runner does not have.
                  flatpak-builder --user --disable-rofiles-fuse --force-clean \
                      --repo=repo --gpg-sign="$GPG_FINGERPRINT" \
                      _build "$MANIFEST"

            - name: Write the repo metadata
              run: |
                  flatpak build-update-repo --generate-static-deltas --prune --prune-depth=20 \
                      --gpg-sign="$GPG_FINGERPRINT" repo

                  # The file a user points flatpak at to add the remote, with the public half of
                  # the signing key in it so their flatpak can check what it downloads.
                  gpg --export "$GPG_FINGERPRINT" | base64 -w0 > key.base64
                  cat > slopnote.flatpakrepo <<EOF
                  [Flatpak Repo]
                  Title=Slopnote
                  Url=${{ vars.SLOPNOTE_REPO_URL }}/repo
                  Homepage=https://github.com/andrinwinzap/rnote
                  Comment=Andrin's own build of Rnote
                  Description=Rnote with the features from Andrin's fork
                  GPGKey=$(cat key.base64)
                  EOF
                  rm key.base64

            - name: Set up the connection to the server
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
                  # Pinned, so the upload cannot be talked into going somewhere else.
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

            - name: Upload the build
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
              run: |
                  ssh_cmd="ssh -i ~/.ssh/deploy -o BatchMode=yes"
                  target="${DEPLOY_PATH}/repo-${GITHUB_SHA}"

                  # Everything that did not change is hardlinked to what is already being served,
                  # so a build costs its own objects and nothing more.
                  rsync -a --delete -e "$ssh_cmd" \
                      --link-dest="${DEPLOY_PATH}/repo/" \
                      repo/ "${DEPLOY_USER}@${DEPLOY_HOST}:${target}/"
                  rsync -a -e "$ssh_cmd" \
                      slopnote.flatpakrepo "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

            - name: Publish it
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
              run: |
                  # Swapping the symlink is one step, so nobody updating at that moment sees a
                  # repo that is half of one build and half of the next. The three kept behind it
                  # are what a rollback would need.
                  ssh -i ~/.ssh/deploy -o BatchMode=yes \
                      "${DEPLOY_USER}@${DEPLOY_HOST}" \
                      "set -eu
                       cd '${DEPLOY_PATH}'
                       ln -sfn 'repo-${GITHUB_SHA}' repo.new
                       mv -Tf repo.new repo
                       touch 'repo-${GITHUB_SHA}'
                       ls -1dt repo-* | tail -n +4 | xargs -r rm -rf"

            - name: Say where it landed
              env:
                  REPO_URL: ${{ vars.SLOPNOTE_REPO_URL }}
              run: |
                  {
                      echo "### Slopnote published"
                      echo
                      echo "Add the remote:"
                      echo
                      echo '```'
                      echo "flatpak remote-add --if-not-exists slopnote ${REPO_URL}/slopnote.flatpakrepo"
                      echo "flatpak install slopnote ch.andrinwinzap.Slopnote"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
