# Serving the Slopnote flatpak repo. Everything in it is a static file.
#
# Traefik is expected in front of this, terminating TLS and routing the domain here, so this
# listens on plain HTTP on a port only traefik reaches. See README.md in this directory.

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /srv/slopnote;

    # The repo is a symlink to the build being served, which is how a publish switches over in
    # one step. Without this nginx refuses to follow it.
    disable_symlinks off;

    # Nothing here is worth listing, and the files a client needs it knows the names of.
    autoindex off;

    location / {
        try_files $uri =404;
    }

    # Everything an ostree repo stores under these is named after what it contains and never
    # changes, so it can be held onto for as long as anything cares to.
    location ~ ^/repo/(objects|deltas|delta-indexes)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # What a client reads to find out whether there is anything new, which is the one thing that
    # must not come from a cache.
    location ~ ^/repo/(config|summary|summary\.sig|summary\.idx)$ {
        add_header Cache-Control "no-cache";
    }

    # Small enough to say, and it saves the trip for the files that are read every update.
    gzip on;
    gzip_types application/octet-stream text/plain;
}
